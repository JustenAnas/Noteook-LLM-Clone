services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: notebook-llm-build

    environment:
      POSTGRES_DB: notebook_llm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5435:5432"

    volumes:
      - notebook_llm_pg_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notebook_llm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  notebook_llm_pg_data: